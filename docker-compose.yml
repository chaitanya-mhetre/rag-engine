# Local stack. Host ports are non-standard (55433, 56380) so they don't clash with other projects.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  api:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      RAG_STORE: postgres
      RAG_DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      RAG_REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "alembic upgrade head && uvicorn ragengine.api.app:create_app --factory --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      RAG_STORE: postgres
      RAG_DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      RAG_REDIS_URL: redis://redis:6379/0
    command: ["arq", "ragengine.worker.WorkerSettings"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
